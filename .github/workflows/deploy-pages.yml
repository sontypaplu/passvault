name: Build and deploy PassVault 3.0
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: passvault-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify source consistency
        run: npm run verify:source
      - name: Test device-only cloud isolation and offline vault workflows
        run: |
          npm run test:device-only
          npm run test:offline-flow
      - name: Test vault-lock and recovery safety
        run: npm run test:security
      - name: Test encrypted edit history
        run: npm run test:history
      - name: Test encrypted data recovery
        run: npm run test:recovery
      - name: Test premium vault experience and custom-field compatibility
        run: npm run test:phase3
      - name: Test online-only install and update safeguards
        run: npm run test:pwa
      - name: Test XSS, URL and Trusted Types safeguards
        run: npm run test:xss
      - name: Build local SDK and project-scoped CSP
        run: npm run build
      - name: Verify static build
        run: npm run verify
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload deployment artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
