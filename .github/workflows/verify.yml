name: Validate PassVault source and regression suite
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Dependency audit (production scope)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run verify
      - name: Sanity-check SQL file naming
        run: |
          for f in supabase/migrations/*.sql; do
            [[ "$(basename "$f")" =~ ^[0-9]{14}_.+\.sql$ ]] || { echo "Invalid migration name: $f"; exit 1; }
          done
