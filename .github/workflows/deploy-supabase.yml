name: Deploy reviewed Supabase backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passvault-backend
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Check required staging configuration
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ORIGINS: ${{ vars.PASSVAULT_ALLOWED_ORIGINS }}
        run: |
          test -n "$REF" && test -n "$TOKEN" && test -n "$PASSWORD" && test -n "$ORIGINS"
      - name: Link isolated staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref '${{ secrets.SUPABASE_PROJECT_REF }}' --password "$SUPABASE_DB_PASSWORD"
      - name: Apply staging-only migrations (do not point this job at production)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --include-all
      - name: Configure strict origin allowlist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALLOWED_ORIGINS: ${{ vars.PASSVAULT_ALLOWED_ORIGINS }}
        run: supabase secrets set "ALLOWED_ORIGINS=$ALLOWED_ORIGINS" --project-ref '${{ secrets.SUPABASE_PROJECT_REF }}'
      - name: Deploy protected Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy delete-vault --project-ref '${{ secrets.SUPABASE_PROJECT_REF }}'
          supabase functions deploy delete-account --project-ref '${{ secrets.SUPABASE_PROJECT_REF }}'
          supabase functions deploy change-account-password --project-ref '${{ secrets.SUPABASE_PROJECT_REF }}'
